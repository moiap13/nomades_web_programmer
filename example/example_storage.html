<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1 id="h1_name"></h1>
  <button id="btn_clear">Clear local storage</button>
  <script>
    const siteData = {
      prenom: "",
      nom : "",
    }

    if(localStorage.getItem("siteData")){
      const siteDataInner = JSON.parse(localStorage.getItem("siteData"))
      document.querySelector("#h1_name").innerHTML = `${siteDataInner.prenom} <br/> ${siteDataInner.nom}`
    } else {
      siteData.prenom = prompt("Veuillez entrez votre prenom :")
      siteData.nom = prompt("Veuillez entrez votre nom :")

      if(siteData.prenom !== null && siteData.nom !== null)
        localStorage.setItem("siteData", JSON.stringify(siteData))
    }

    document.querySelector("#btn_clear").addEventListener("click", e => {
      localStorage.removeItem("siteData")
      localStorage.clear()
    })
  </script>
</body>
</html>
